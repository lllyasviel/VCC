name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m py_compile skills/conversation-compiler/scripts/VCC.py skills/conversation-compiler/scripts/history_search.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: |
          python skills/conversation-compiler/scripts/VCC.py --version
          python skills/conversation-compiler/scripts/VCC.py history-search --help
